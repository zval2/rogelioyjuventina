<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#71142d">
  <meta name="description" content="Nuestra Boda — Rogelio y Juventina — 19 de Septiembre 2026.">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_US">
  <meta property="og:title" content="Nuestra Boda | Rogelio y Juventina">
  <meta property="og:description" content="Acompáñanos a celebrar nuestra boda el 19 de Septiembre 2026.">
  <meta property="og:url" content="https://zval2.github.io/rogelioyjuventina/">
  <meta property="og:image" content="https://zval2.github.io/rogelioyjuventina/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Invitación de boda de Rogelio y Juventina">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nuestra Boda | Rogelio y Juventina">
  <meta name="twitter:description" content="19 de Septiembre 2026">
  <meta name="twitter:image" content="https://zval2.github.io/rogelioyjuventina/preview.jpg">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <title>Nuestra Boda | Rogelio y Juventina</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true">
    <div id="sparkles"></div>
    <div id="petals"></div>
  </div>

  <div id="transitionCurtain" class="transition-curtain" aria-hidden="true">
    <div class="curtain-glow"></div>
  </div>

  <section id="intro" class="intro">
    <div class="intro-glow" aria-hidden="true"></div>
    <div class="monogram" aria-hidden="true"><span>R</span><i>♥</i><span>J</span></div>
    <p class="eyebrow">Nuestra Boda</p>
    <h1>Rogelio <span>y</span> Juventina</h1>
    <p class="date">19 de Septiembre 2026</p>

    <div id="countdown" class="countdown" aria-label="Cuenta regresiva para la boda">
      <div><strong id="days">0</strong><small>Días</small></div>
      <div><strong id="hours">0</strong><small>Horas</small></div>
      <div><strong id="minutes">0</strong><small>Min</small></div>
      <div><strong id="seconds">0</strong><small>Seg</small></div>
    </div>
    <p id="dayMessage" class="day-message" hidden></p>

    <button id="openBtn" class="gold-button" type="button"><span>Abrir Invitación</span></button>
    <p class="sound-note">La música comenzará al abrir la invitación.</p>
  </section>

  <main id="invitation" class="invitation" aria-hidden="true">
    <section class="card-section front-section">
      <div class="card-frame entrance-card">
        <div class="one-time-sweep" aria-hidden="true"></div>
        <img src="front.jpg" alt="Frente de la invitación de boda de Rogelio y Juventina">
      </div>
    </section>

    <section class="card-section back-section">
      <div class="card-frame">
        <div class="soft-sweep" aria-hidden="true"></div>
        <img src="back.jpg" alt="Reverso de la invitación con los detalles de la boda">
      </div>
    </section>

    <section class="finale">
      <p class="finale-script">Con mucho cariño, los esperamos para celebrar juntos este día tan especial</p>
      <p class="finale-names">Rogelio y Juventina</p>
      <p class="finale-date">19 de Septiembre 2026</p>

      <div class="actions">
        <a class="action-button"
           href="https://www.google.com/maps/search/?api=1&query=976+E+47th+St+Los+Angeles+CA+90011"
           target="_blank"
           rel="noopener noreferrer">
          <span aria-hidden="true">⌖</span>Recepción
        </a>

        <button id="shareBtn" class="action-button" type="button">
          <span aria-hidden="true">↗</span>Compartir
        </button>
      </div>
      <p id="shareMessage" class="share-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <audio id="music" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
