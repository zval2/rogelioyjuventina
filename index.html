<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070504">
  <meta name="description" content="Invitación de boda de Rogelio y Juventina — 19 de septiembre de 2026.">
  <title>Nuestra Boda | Rogelio y Juventina</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div id="sparkles"></div>
    <div id="petals"></div>
  </div>

  <section id="intro" class="intro">
    <div class="intro-glow" aria-hidden="true"></div>

    <div class="monogram" aria-hidden="true">
      <span>R</span><i>♥</i><span>J</span>
    </div>

    <p class="eyebrow">Nuestra Boda</p>
    <h1>Rogelio <span>y</span> Juventina</h1>
    <p class="date">19 de Septiembre de 2026</p>

    <div id="countdown" class="countdown" aria-label="Cuenta regresiva para la boda">
      <div><strong id="days">0</strong><small>Días</small></div>
      <div><strong id="hours">0</strong><small>Horas</small></div>
      <div><strong id="minutes">0</strong><small>Min</small></div>
      <div><strong id="seconds">0</strong><small>Seg</small></div>
    </div>

    <button id="openBtn" class="gold-button" type="button">
      <span>Abrir Invitación</span>
    </button>

    <p class="sound-note">La música comenzará al abrir la invitación.</p>
  </section>

  <main id="invitation" class="invitation" aria-hidden="true">
    <section class="card-section front-section">
      <p class="section-label">Nuestra invitación</p>

      <div class="card-frame">
        <div class="shimmer" aria-hidden="true"></div>
        <img src="front.jpg" alt="Frente de la invitación de boda de Rogelio y Juventina">
      </div>

      <button id="showBackBtn" class="outline-button" type="button">
        Ver Reverso
      </button>
    </section>

    <section id="backSection" class="card-section back-section">
      <p class="section-label">Detalles de nuestra boda</p>

      <div class="card-frame">
        <div class="shimmer shimmer-delay" aria-hidden="true"></div>
        <img src="back.jpg" alt="Reverso de la invitación con los detalles de la boda">
      </div>
    </section>

    <section class="finale">
      <p class="finale-script">Los esperamos con mucho cariño</p>
      <p class="finale-names">Rogelio y Juventina</p>

      <div class="actions">
        <a class="action-button"
           href="https://www.google.com/maps/search/?api=1&query=976+E+47th+St+Los+Angeles+CA+90011"
           target="_blank"
           rel="noopener noreferrer">
          <span aria-hidden="true">⌖</span>
          Recepción
        </a>

        <button id="shareBtn" class="action-button" type="button">
          <span aria-hidden="true">↗</span>
          Compartir
        </button>
      </div>

      <p id="shareMessage" class="share-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <audio id="music" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
